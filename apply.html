<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Application Form</title>
</head>
<body>

  <h1>Job Application Form</h1>

  <form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">

    <!-- 1. Position Vacancy -->
    <fieldset>
      <legend>Position Vacancy</legend>
      <p>
        <label for="jobRef">Job Reference Number:</label><br>
        <input type="text" name="jobRef" id="jobRef" required pattern="^[a-zA-Z0-9]{5}$" placeholder="e.g. AB123">
      </p>
    </fieldset>

    <!-- 2. Personal Information -->
    <fieldset>
      <legend>Personal Information</legend>

      <p>
        <label for="firstName">First Name:</label><br>
        <input type="text" name="firstName" id="firstName" required maxlength="20" pattern="^[A-Za-z]{1,20}$">
      </p>

      <p>
        <label for="lastName">Last Name:</label><br>
        <input type="text" name="lastName" id="lastName" required maxlength="20" pattern="^[A-Za-z]{1,20}$">
      </p>

      <p>
        <label for="dob">Date of Birth (dd/mm/yyyy):</label><br>
        <input type="text" name="dob" id="dob" required pattern="^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[012])\/(19|20)\d\d$" placeholder="dd/mm/yyyy">
      </p>

      <!-- Gender Fieldset inside Personal Info -->
      <fieldset>
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="male" required> Male</label><br>
        <label><input type="radio" name="gender" value="female" required> Female</label><br>
        <label><input type="radio" name="gender" value="nonbinary" required> Non-binary</label><br>
        <label><input type="radio" name="gender" value="other" required> Prefer not to say</label>
      </fieldset>
    </fieldset>

    <!-- 3. Contact & Address Details -->
    <fieldset>
      <legend>Contact & Address Details</legend>

      <p>
        <label for="address">Street Address:</label><br>
        <input type="text" name="address" id="address" required maxlength="40">
      </p>

      <p>
        <label for="suburb">Suburb/Town:</label><br>
        <input type="text" name="suburb" id="suburb" required maxlength="40">
      </p>

      <p>
        <label for="state">State:</label><br>
        <select name="state" id="state" required>
          <option value="" disabled selected>Select State</option>
          <option value="VIC">VIC</option>
          <option value="NSW">NSW</option>
          <option value="QLD">QLD</option>
          <option value="NT">NT</option>
          <option value="WA">WA</option>
          <option value="SA">SA</option>
          <option value="TAS">TAS</option>
          <option value="ACT">ACT</option>
        </select>
      </p>

      <p>
        <label for="postcode">Postcode:</label><br>
        <input type="text" name="postcode" id="postcode" required pattern="^[0-9]{4}$" maxlength="4" placeholder="3000">
      </p>

      <p>
        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email" required>
      </p>

      <p>
        <label for="phone">Phone Number:</label><br>
        <input type="tel" name="phone" id="phone" required pattern="^[0-9\s\-]{8,12}$" placeholder="0412345678">
      </p>
    </fieldset>

    <!-- 4. Skills & Qualifications -->
    <fieldset>
      <legend>Skills & Qualifications</legend>

      <fieldset>
        <legend>Skill List</legend>
        <label><input type="checkbox" name="skills[]" value="HTML" checked="checked"> HTML</label><br>
        <label><input type="checkbox" name="skills[]" value="CSS"> CSS</label><br>
        <label><input type="checkbox" name="skills[]" value="JavaScript"> JavaScript</label><br>
        <label><input type="checkbox" name="skills[]" value="PHP"> PHP</label>
      </fieldset>

      <p>
        <label for="otherSkills">Other Skills:</label><br>
        <textarea name="otherSkills" id="otherSkills" rows="4" cols="40"></textarea>
      </p>
    </fieldset>

    <!-- Submit & Reset Buttons -->
    <p>
      <input type="submit" value="Apply">
      <input type="reset" value="Reset">
    </p>

  </form>

</body>
</html>
